spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/billing}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 20
      min-spare: 2
    max-connections: 200
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  jwt-secret: ${JWT_SECRET:}
  jwt-expiry-minutes: ${JWT_EXPIRY_MINUTES:480}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  admin-username: ${ADMIN_USERNAME:Admin}
  admin-password: ${ADMIN_PASSWORD:admin@1234}
